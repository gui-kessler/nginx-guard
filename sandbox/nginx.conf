# Carregado no contexto principal: sem alterar as locations em cada server.
load_module modules/ngx_http_guard_module.so;

worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx-guard.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;
        root /opt/nginx/html;

        # Uma location comum de exemplo. O modulo nao depende dela.
        # Evitamos 'return' na fase rewrite para testar PREACCESS.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
